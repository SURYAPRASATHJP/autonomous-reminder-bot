services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reminders
      POSTGRES_PASSWORD: reminders
      POSTGRES_DB: reminders
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminders -d reminders"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  init:
    build: .
    image: reminder-bot
    command: python postgres_db.py
    environment:
      DB_URL: postgresql://reminders:reminders@db:5432/reminders
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    

  app:
    image: reminder-bot
    command: streamlit run app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DB_URL: postgresql://reminders:reminders@db:5432/reminders
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  poller:
    image: reminder-bot
    command: python poller.py
    environment:
      DB_URL: postgresql://reminders:reminders@db:5432/reminders
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata: